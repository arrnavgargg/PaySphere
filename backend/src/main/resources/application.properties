# ===================================================================
# PaySphere Application Configuration
# ===================================================================
spring.application.name=paysphere-backend
server.port=8080

# Common JPA / Hibernate settings
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Springdoc OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# ===================================================================
# Default Profile: H2 In-Memory Database (Local Testing & Development)
# Active by default when no specific profile is specified
# ===================================================================
spring.datasource.url=jdbc:h2:mem:payspheredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ===================================================================
# Profile: postgres (PostgreSQL Database for Production / Staging)
# Activate via: --spring.profiles.active=postgres or SPRING_PROFILES_ACTIVE=postgres
# ===================================================================
#---
spring.config.activate.on-profile=postgres

# PostgreSQL Datasource configuration (with environment variable defaults)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:payspheredb}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

# PostgreSQL JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Disable H2 console in postgres profile
spring.h2.console.enabled=false
